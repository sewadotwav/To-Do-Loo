@if (showSplash()) {
  <div class="splash">
    <svg class="splash-mark" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="15" stroke="var(--lime)" stroke-width="2" />
      <path d="M10 16.5L14 20.5L22 11.5" stroke="var(--lime)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
    <h1>To-Do-Loo<span class="dot">.</span></h1>
  </div>
} @else {
  <div class="page">
    <app-header />
    <div class="board">
      <app-task-form />
      <app-task-list />
    </div>
  </div>
}

<div class="toast-stack">
  @for (toast of toasts(); track toast.id) {
    <div class="toast">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>{{ toast.message }}</span>
    </div>
  }
</div>
