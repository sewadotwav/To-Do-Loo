<div class="task-item" [class.completed]="task.completed">
  <button
    type="button"
    class="check"
    (click)="toggleComplete()"
    [attr.aria-label]="task.completed ? 'Mark as not done' : 'Mark as done'"
  >
    @if (task.completed) {
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8.5L6.5 12L13 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    }
  </button>

  <span class="title" (dblclick)="startEdit()">{{ task.title }}</span>

  <div class="actions">
    <button type="button" class="icon-btn" (click)="startEdit()" aria-label="Edit task">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M11.5 2.5L13.5 4.5L5 13H3V11L11.5 2.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
      </svg>
    </button>
    <button type="button" class="icon-btn danger" (click)="askDelete()" aria-label="Delete task">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 4.5H13M6 4.5V3H10V4.5M4.5 4.5L5 13H11L11.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
  </div>
</div>

@if (isEditing()) {
  <div class="edit-overlay" (click)="cancelEdit()">
    <div class="edit-modal" (click)="$event.stopPropagation()">
      <h3>Edit Task</h3>
      <input
        #editInput
        type="text"
        class="edit-input"
        [value]="task.title"
        autofocus
        (keyup.enter)="saveEdit(editInput)"
        (keyup.escape)="cancelEdit()"
      />
      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="cancelEdit()">Cancel</button>
        <button type="button" class="btn-save" (click)="saveEdit(editInput)">Save Changes</button>
      </div>
    </div>
  </div>
}

@if (isConfirmingDelete()) {
  <div class="edit-overlay" (click)="cancelDelete()">
    <div class="confirm-modal" (click)="$event.stopPropagation()">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 7H19M9 7V5H15V7M6 7L6.8 19H17.2L18 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <h3>Delete this task?</h3>
      <p>"{{ task.title }}" will be removed. This can't be undone.</p>
      <div class="modal-actions">
        <button type="button" class="btn-cancel" (click)="cancelDelete()">Cancel</button>
        <button type="button" class="btn-delete" (click)="confirmDelete()">Delete Task</button>
      </div>
    </div>
  </div>
}
